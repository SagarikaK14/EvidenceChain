services:
  - type: web
    name: evidencechain
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: PUBLIC_ACCESS_ENABLED
        value: "true"
      - key: FAIL_CLOSED
        value: "false"
      - key: BLOCKCHAIN_RPC_URL
        value: "http://127.0.0.1:8555"
      - key: CONTRACT_ADDRESS
        value: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      - key: DEMO_USER_PASSWORD
        value: "Demo@12345"
      - key: SECRET_KEY
        generateValue: true
